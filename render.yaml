# render.yaml — Render Blueprint spec
# https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard → New → Blueprint → connect this repo.

services:
  - type: web
    name: featurepulse-backend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    plan: free
    envVars:
      - key: APP_ID
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
